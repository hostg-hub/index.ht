<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neón Hand Draw AR</title>
    <!-- Cargamos MediaPipe desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }
        video, canvas {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            text-align: center;
        }
        #canvas {
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">Pellizca para dibujar 👍</div>
    <video id="video" playsinline autoplay muted></video>
    <!-- Canvas secundario para el trazo permanente -->
    <canvas id="persistentCanvas"></canvas>
    <!-- Canvas principal para el video y la mano en vivo -->
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const persistentCanvas = document.getElementById('persistentCanvas');
        const pCtx = persistentCanvas.getContext('2d');
        const ui = document.getElementById('ui-overlay');

        // Variables para el trazo
        let lastPoint = null;
        let drawing = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            persistentCanvas.width = window.innerWidth;
            persistentCanvas.height = window.innerHeight;
            // Configuración neón por defecto para el trazo persistente
            pCtx.strokeStyle = '#00e5ff'; // Cian Neón
            pCtx.lineWidth = 8;
            pCtx.lineCap = 'round';
            pCtx.shadowColor = '#00e5ff';
            pCtx.shadowBlur = 15;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Configurar MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7, // Subimos un poco para mejor precisión
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // Detectar gesto de pellizco (Pinch)
        function isPinching(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const distance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2)
            );
            return distance < 0.05; // Umbral de cercanía (ajustable)
        }

        function onResults(results) {
            // Limpiar canvas principal (video en vivo)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    const indexTip = landmarks[8];
                    const x = indexTip.x * canvas.width;
                    const y = indexTip.y * canvas.height;

                    // Dibujar cursor en la punta del índice
                    ctx.beginPath();
                    ctx.arc(x, y, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = isPinching(landmarks) ? 'white' : 'rgba(0,229,255,0.5)';
                    ctx.fill();

                    if (isPinching(landmarks)) {
                        ui.innerText = "Dibujando...";
                        if (!drawing) {
                            drawing = true;
                            lastPoint = { x, y };
                        } else {
                            // Dibujar línea en el canvas persistente
                            pCtx.beginPath();
                            pCtx.moveTo(lastPoint.x, lastPoint.y);
                            pCtx.lineTo(x, y);
                            pCtx.stroke();
                            lastPoint = { x, y };
                        }
                    } else {
                        ui.innerText = "Pellizca para dibujar 👍";
                        drawing = false;
                        lastPoint = null;
                    }
                }
            } else {
                ui.innerText = "Muestra tu mano 👋";
            }
        }

        // Iniciar la cámara en el iPhone
        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({image: video});
            },
            width: 1280,
            height: 720,
            facingMode: 'environment'
        });
        
        camera.start();
    </script>
</body>
</html>
